<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings Lab — Zoi</title>
<meta name="description" content="Your settings, measured. Every change is compared against the games you played before it.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050506">
<!-- The lab saves to a home screen as the main Zoi mark, not a second logo: same
     bolt, laurel and column as the site, on the same black, so the app icon and
     the site read as one team. The SVG is what a browser tab uses; the PNGs are
     the fallback and the iOS home-screen icon, which cannot take an SVG and
     cannot take transparency. ?v= is the icon cache-buster: a home screen keeps
     the image it first downloaded, so a changed mark needs a changed URL. -->
<link rel="icon" href="assets/lab-icon.svg?v=2" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="assets/lab-icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/lab-icon-180.png?v=2">
<link rel="manifest" href="lab.webmanifest">
<meta name="apple-mobile-web-app-title" content="Zoi Lab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css?v=43">
</head>
<body class="lab-page">
<header class="nav"><a href="/" class="brand"><img class="zw" src="/assets/zoi-wordmark-gold.png?v=10" alt="Zoi" width="600" height="320"></a>
<nav><a href="/#about">About</a><a href="/#roster">Roster</a><a href="/#tryouts">Rush</a><a href="/#events">Events</a><a href="/#socials">Socials</a><a href="/results">Results</a><a href="/lab" aria-current="page">Lab</a><a href="/shop">Shop</a></nav>
<div class="nav-end"><button class="menu" aria-label="Menu" aria-expanded="false">☰</button><button class="acct-btn" type="button" id="acct-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Your account" hidden><span class="acct-initial" id="acct-initial">?</span></button></div></header>
<main class="lab">
<h1 class="lab-h1">Settings Lab</h1>

<div class="lab-error" id="load-error" hidden>
 <p id="load-error-text">Couldn't reach the log. It may be the connection.</p>
 <button class="btn ghost" type="button" id="retry">Try again</button>
</div>

<div id="app" hidden>

<!-- 1. One takeaway: what to keep, change, or keep playing. The rest of the
     page is evidence for this line. -->
<section class="lab-block" id="takeaway-block" hidden>
 <div id="takeaway"></div>
</section>

<!-- 2. Open tests, compact. A card here is still being played; decided ones
     live only under Past changes. -->
<section class="lab-block" id="now-block" hidden>
 <h2 class="lab-h2">On test now</h2>
 <div id="now"></div>
</section>

<!-- 3. Which setting has actually helped, before the long history. -->
<section class="lab-block" id="ranked-block" hidden>
 <h2 class="lab-h2">What's worked</h2>
 <div id="ranked"></div>
</section>

<!-- 4. Every finished change, newest first. -->
<section class="lab-block" id="changes-block" hidden>
 <h2 class="lab-h2">Past changes</h2>
 <div id="changes"></div>
</section>

<!-- 5. Sessions over time. Below the verdicts, so it does not compete with
     the answer at the top. -->
<section class="lab-block" id="charts-block" hidden>
 <h2 class="lab-h2">Over time</h2>
 <div class="lab-chart lab-chart-lead" id="chart-kpm">
  <p class="lab-chart-k">Kills a match</p>
  <div class="lab-chart-box" id="chart-kpm-box"></div>
 </div>
 <div class="lab-chart" id="chart-win">
  <p class="lab-chart-k">Win rate</p>
  <div class="lab-chart-box" id="chart-win-box"></div>
 </div>
 <p class="lab-chart-key" id="chart-key" hidden></p>
 <p class="lab-empty" id="chart-empty" hidden></p>
</section>

<!-- Kept in the document for the numbers, but not shown as its own section:
     the same figures already sit on the open test. -->
<section class="lab-block" id="window-block" hidden>
 <h2 class="lab-h2">Since the last change</h2>
 <div id="window"></div>
</section>

<!-- 6. Reference: current values, then all-time totals. -->
<section class="lab-block" id="current-block">
 <h2 class="lab-h2">Current settings</h2>
 <p class="lab-mode" id="current-mode" hidden></p>
 <div id="current"></div>
 <p class="lab-fine" id="current-note" hidden></p>
</section>

<section class="lab-block" id="totals-block">
 <details class="lab-fold">
  <summary class="lab-fold-k">All-time totals</summary>
  <div class="lab-figures" id="figures"></div>
  <p class="lab-fine" id="figures-note" hidden></p>
 </details>
</section>

</div>
</main>

<script src="main.js?v=23" defer></script>
<script src="account.js?v=7" defer></script>
<script src="lab.js?v=16" defer></script>
</body>
</html>
